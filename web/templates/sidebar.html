{{ define "sidebar" }}
<script>
    if (localStorage.getItem('sidebarTheme') === 'dark') {
        document.body.classList.add('dark-sidebar');
    }
</script>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="brand-logo-wrapper">
            <i class="bi bi-cpu-fill text-primary" style="font-size: 28px;"></i>
        </div>
        <div class="brand-typography">
            <span class="brand-title">BPI Hub</span>
            <span class="brand-subtitle">Maximo $\leftrightarrow$ SAP Grow</span>
        </div>
    </div>

    <div class="sidebar-section">Monitoring</div>
    <ul class="nav flex-column mb-auto">
        <li class="nav-item">
            <a href="/panel" class="nav-link {{ if eq .ActiveMenu "dashboard" }}active{{ end }}">
                <i class="bi bi-grid-1x2-fill"></i> Integration Tracking
            </a>
        </li>
    </ul>

    <div class="sidebar-section">Testing Tools</div>
    <ul class="nav flex-column mb-auto">
        <li class="nav-item">
            <a href="/swagger/index.html" target="_blank" class="nav-link">
                <i class="bi bi-code-slash"></i> Swagger OpenAPI
            </a>
        </li>
    </ul>

    <div class="sidebar-footer p-3 mt-auto d-flex justify-content-center">
        <button type="button" id="sidebarFooterToggleBtn" class="btn theme-toggle-btn d-flex align-items-center justify-content-center shadow-sm" style="width: 36px; height: 36px; border-radius: 50%; padding: 0;" title="Toggle Sidebar Theme">
            <i class="bi bi-moon-stars-fill" id="sidebarToggleIcon" style="font-size: 15px;"></i>
        </button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const body = document.body;
        const toggleIcon = document.getElementById('sidebarToggleIcon');
        const savedTheme = localStorage.getItem('sidebarTheme') || 'light';
        
        function updateUI(theme) {
            if (theme === 'dark') {
                if(toggleIcon) toggleIcon.className = 'bi bi-sun-fill text-warning';
            } else {
                if(toggleIcon) toggleIcon.className = 'bi bi-moon-stars-fill text-secondary';
            }
        }
        updateUI(savedTheme);

        const toggleBtn = document.getElementById('sidebarFooterToggleBtn');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                const isDark = body.classList.contains('dark-sidebar');
                const newTheme = isDark ? 'light' : 'dark';
                if (newTheme === 'dark') {
                    body.classList.add('dark-sidebar');
                } else {
                    body.classList.remove('dark-sidebar');
                }
                updateUI(newTheme);
                localStorage.setItem('sidebarTheme', newTheme);
            });
        }
    });
</script>
{{ end }}
