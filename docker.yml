# ==============================================================================
# BPI MIDDLEWARE & WEB PANEL - DOCKER COMPOSE CONFIGURATION (docker.yml)
# ==============================================================================
# Seluruh konfigurasi awal (Database, SAP Grow, Maximo SQL Server, Web Panel)
# sudah terpusat di file ini. Anda dapat langsung menjalankan:
#   docker compose -f docker.yml up -d --build
# atau:
#   docker-compose -f docker.yml up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE ENGINE: PostgreSQL 16
  # Menampung Dokumen Staging, Audit Trail, Endpoints, Mappings, dan Kurs Pajak
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bpi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: bpi_middleware_db
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./middleware/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bpi_middleware_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - bpi-network

  # ----------------------------------------------------------------------------
  # 2. CORE BACKEND ENGINE: Golang Middleware (API & Dual-Thread Worker)
  # Port: 8085 | Swagger UI: http://localhost:8085/swagger/index.html
  # ----------------------------------------------------------------------------
  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: bpi-middleware
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Port Aplikasi Engine
      APP_PORT: 8085

      # Koneksi Database PostgreSQL Lokal / Docker Network
      PG_CONN_STRING: postgres://postgres:postgres123@postgres:5432/bpi_middleware_db?sslmode=disable

      # Koneksi SQL Server Maximo (Ubah host ke IP database Maximo jika di server berbeda)
      # Gunakan 'host.docker.internal' jika SQL Server berjalan langsung di OS Host Server
      SQL_CONN_STRING: sqlserver://sa:password@host.docker.internal:1433?database=MAX_BPI_TEST&encrypt=disable

      # Kredensial Resmi SAP Grow S/4HANA Cloud OData
      SAP_BASE_URL: https://my445160-api.s4hana.cloud.sap
      SAP_USER: CU_SAP_COM_0053
      SAP_PASS: PowerofOne@123456789

      # Konfigurasi Auto-Pull Background Poller (Maximo -> Staging)
      AUTO_PULL_ENABLED: "false"
      PULL_INTERVAL_MINUTES: "3"
      PULL_BATCH_LIMIT: "1"

      TZ: Asia/Jakarta
    ports:
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bpi-network

  # ----------------------------------------------------------------------------
  # 3. WEB MANAGEMENT PANEL: Golang Web Panel (UI & RBAC Access Control)
  # Port: 8091 | URL Akses: http://localhost:8091 (Login: admin / admin)
  # ----------------------------------------------------------------------------
  middleware-panel:
    build:
      context: ./middleware-panel
      dockerfile: Dockerfile
    container_name: bpi-middleware-panel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      middleware:
        condition: service_started
    environment:
      # Port Aplikasi Web Panel
      APP_PORT: 8091
      SESSION_SECRET: kunci_rahasia_bpi_panel_2026

      # Kredensial Awal Administrator Panel
      PANEL_ADMIN_USER: admin
      PANEL_ADMIN_PASS: admin

      # Koneksi Database PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: bpi_middleware_db

      # URL Akses ke Middleware Engine (Internal Docker DNS)
      MIDDLEWARE_API_URL: http://middleware:8085/api/v1
      API_URL: http://middleware:8085/api/v1
      BACKUP_API_URL: http://middleware:8085/api/backup

      AUTO_PULL_ENABLED: "true"
      TZ: Asia/Jakarta
    ports:
      - "8091:8091"
    networks:
      - bpi-network

# ------------------------------------------------------------------------------
# VOLUMES & NETWORKS
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: bpi_postgres_data

networks:
  bpi-network:
    name: bpi_integration_network
    driver: bridge
