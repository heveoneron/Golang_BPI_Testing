    <!-- TOMBOL TOGGLE DI FOOTER SIDEBAR -->
    <div class="sidebar-footer p-3 mt-auto d-flex justify-content-center">
        <button type="button" id="sidebarFooterToggleBtn" class="btn theme-toggle-btn d-flex align-items-center justify-content-center shadow-sm" style="width: 36px; height: 36px; border-radius: 50%; padding: 0;" title="Toggle Sidebar Theme">
            <i class="bi bi-moon-stars-fill" id="sidebarToggleIcon" style="font-size: 15px;"></i>
        </button>
    </div>
</div>

<!-- SCRIPT UNTUK INTERAKSI TOMBOL DAN IKON (Berjalan di latar belakang) -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const body = document.body;
        const toggleIcon = document.getElementById('sidebarToggleIcon');
        const toggleText = document.getElementById('sidebarToggleText');
        const savedTheme = localStorage.getItem('sidebarTheme') || 'light';
        
        // Hanya bertugas merender ikon dan teks, karena warna background sudah diurus script atas
        function updateUI(theme) {
            if (theme === 'dark') {
                if(toggleIcon) toggleIcon.className = 'bi bi-sun-fill text-warning';
                if(toggleText) toggleText.innerText = 'Light Sidebar';
            } else {
                if(toggleIcon) toggleIcon.className = 'bi bi-moon-stars-fill text-secondary';
                if(toggleText) toggleText.innerText = 'Dark Sidebar';
            }
        }

        // Terapkan UI ikon saat halaman dimuat
        updateUI(savedTheme);

        // Targetkan ID unik tombol
        const toggleBtn = document.getElementById('sidebarFooterToggleBtn');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                const isDark = body.classList.contains('dark-sidebar');
                const newTheme = isDark ? 'light' : 'dark';
                
                if (newTheme === 'dark') {
                    body.classList.add('dark-sidebar');
                } else {
                    body.classList.remove('dark-sidebar');
                }
                
                updateUI(newTheme);
                localStorage.setItem('sidebarTheme', newTheme);
            });
        }
    });
</script>
{{ end }}
