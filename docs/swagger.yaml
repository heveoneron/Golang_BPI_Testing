basePath: /api/v1
definitions:
  golang-bpi-testing_internal_model.MaximoPOHeader:
    properties:
      CURRENCYCODE:
        example: IDR
        type: string
      LINES:
        items:
          $ref: '#/definitions/golang-bpi-testing_internal_model.MaximoPOLine'
        type: array
      ORDERDATE:
        example: "2026-10-12"
        type: string
      PONUM:
        example: PO-BPI-2026-001
        type: string
      REVISIONNUM:
        example: 0
        type: integer
      STATUS:
        example: APPR
        type: string
      VENDOR:
        example: VEND-PLTU-01
        type: string
    type: object
  golang-bpi-testing_internal_model.MaximoPOLine:
    properties:
      BUDGETCODE:
        example: "10081"
        type: string
      DEPARTMENT:
        example: "3000"
        type: string
      ITEMNUM:
        example: BEARING-TURBINE-6204
        type: string
      LINETYPE:
        example: ITEM
        type: string
      MAINACCOUNT:
        example: "513043"
        type: string
      ORDERUNIT:
        example: PCS
        type: string
      POLINENUM:
        example: 1
        type: integer
      PRLINENUM:
        example: 1
        type: integer
      PRNUM:
        example: PR-2026-001
        type: string
      QTY:
        example: 5
        type: number
      TAXCODE1:
        example: V1
        type: string
      UNITCOST:
        example: 150000
        type: number
    type: object
  internal_controller.DocumentItemDTO:
    properties:
      created_at:
        example: "2026-10-12T14:00:00Z"
        type: string
      doc_type:
        example: PO
        type: string
      document_no:
        example: PO-BPI-2026-001
        type: string
      group_id:
        example: GRP-PO-PO-BPI-2026-001
        type: string
      id:
        example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        type: string
      raw_payload:
        type: object
      retry_count:
        example: 0
        type: integer
      sap_document_no:
        example: SAP-PO-1730000000
        type: string
      sap_payload:
        type: object
      status:
        example: pending
        type: string
    type: object
  internal_controller.ErrorResponse:
    properties:
      error:
        example: invalid request body
        type: string
    type: object
  internal_controller.GetDocumentsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_controller.DocumentItemDTO'
        type: array
      total:
        example: 1
        type: integer
    type: object
  internal_controller.HealthResponse:
    properties:
      service:
        example: BPI Maximo-SAP Grow Middleware
        type: string
      status:
        example: running
        type: string
    type: object
  internal_controller.IngestManualPOResponse:
    properties:
      document_no:
        example: PO-BPI-2026-001
        type: string
      message:
        example: PO successfully ingested into staging_documents and transformed to
          core documents
        type: string
      transformed:
        example: 1
        type: integer
    type: object
  internal_controller.TriggerPushResponse:
    properties:
      message:
        example: Push trigger executed
        type: string
      pushed_count:
        example: 1
        type: integer
    type: object
host: localhost:8085
info:
  contact:
    name: BPI Middleware Development Team
  description: 'Middleware integrasi enterprise: IBM Maximo <-> PostgreSQL Staging
    & State Machine <-> SAP Grow S/4HANA Cloud OData.'
  title: BPI Maximo to SAP Grow Middleware Engine API
  version: "1.0"
paths:
  /documents:
    get:
      description: Mengambil hingga 50 data dokumen antrean & status integrasi SAP
        dari tabel documents
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_controller.GetDocumentsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_controller.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_controller.ErrorResponse'
      summary: Lihat Daftar Core Documents
      tags:
      - Monitoring
  /health:
    get:
      description: Memeriksa status service BPI Maximo-SAP Grow Middleware
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_controller.HealthResponse'
      summary: Health Check Service
      tags:
      - System
  /ingest/po:
    post:
      consumes:
      - application/json
      description: Simulasi webhook atau inject payload PO Maximo secara langsung
        ke staging_documents dan mentransformasikannya ke documents
      parameters:
      - description: Maximo PO Header JSON Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/golang-bpi-testing_internal_model.MaximoPOHeader'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_controller.IngestManualPOResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_controller.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_controller.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_controller.ErrorResponse'
      summary: Ingest Manual PO Maximo
      tags:
      - Ingestion
  /trigger/push:
    post:
      description: Memicu eksekusi manual worker push untuk mengirim dokumen pending
        ke SAP Grow OData
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_controller.TriggerPushResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_controller.ErrorResponse'
      summary: Trigger Push Dispatcher ke SAP Grow
      tags:
      - Dispatching
schemes:
- http
- https
swagger: "2.0"
